<text x="48" y="52" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="21" font-weight="700" fill="#0b0b0b">転職が多い県は、労働市場が厚いのか、雇用が不安定なのか — 47都道府県の構造方程式モデリング</text>
<text x="48" y="78" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="12.5" font-weight="400" fill="#77766f">e-Stat 社会・人口統計体系「社会生活統計指標－都道府県の指標－2024」（転職率・離職率は2017年、他は2015〜2021年）　semopy 2.3.11・最尤法・全変数を標準化</text>
<rect x="40" y="118" width="1200" height="572" rx="10" fill="#ffffff" stroke="#d5d4cf"/>
<text x="64" y="150" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="16" font-weight="700" fill="#0b0b0b">ふたつの独立した経路が、それぞれ転職率を押し上げる</text>
<text x="64" y="174" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="12.5" font-weight="400" fill="#77766f">N = 47 都道府県　χ²/df = 2.14　CFI = 0.951　TLI = 0.895　RMSEA = 0.157　残差相関の最大 |r| = 0.145</text>
