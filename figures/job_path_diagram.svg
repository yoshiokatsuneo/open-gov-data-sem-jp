<rect x="72.0" y="468.0" width="236" height="40" rx="5" fill="#ffffff" stroke="#d5d4cf" stroke-width="1.5"/><text x="190" y="493" text-anchor="middle" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="12.5" font-weight="400" fill="#52514e">離職率</text>
<rect x="72.0" y="524.0" width="236" height="40" rx="5" fill="#ffffff" stroke="#d5d4cf" stroke-width="1.5"/><text x="190" y="549" text-anchor="middle" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="12.5" font-weight="400" fill="#52514e">完全失業率</text>
<rect x="64" y="588" width="560" height="86" rx="8" fill="#f2f7fd" stroke="#cfe0f5"/>
<text x="82" y="612" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1c5cab">読みどころ</text>
<text x="82" y="634" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#52514e">・2つの説明側の相関は −0.07（n.s.）。まったく別の次元として分離する。</text>
<text x="82" y="651" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#52514e">・離職率は「雇用の不安定さ」の指標であって、転職率とは r = 0.29 しかない。</text>
<text x="82" y="668" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#52514e">・有効求人倍率は転職率と −0.36。逼迫と労働移動は別物（モデル外）。</text>
<rect x="648" y="588" width="568" height="86" rx="8" fill="#fdf8ef" stroke="#e8d9b8"/>
<text x="666" y="612" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#8a6d1f">ブートストラップ（復元抽出600回）標準化係数の 95% 区間</text>
<text x="666" y="635" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#52514e">都市労働市場の厚み → 転職率</text>
<text x="900" y="635" text-anchor="end" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="11.5" font-weight="600" fill="#52514e">+0.49</text>
<text x="1010" y="635" text-anchor="end" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#52514e">[+0.20, +0.75]</text>
<text x="1024" y="635" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#52514e">0を含まない</text>
<text x="666" y="653" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#77766f">雇用の不安定さ → 転職率</text>
<text x="900" y="653" text-anchor="end" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="11.5" font-weight="600" fill="#77766f">+0.40</text>
<text x="1010" y="653" text-anchor="end" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#77766f">[-0.01, +0.70]</text>
<text x="1024" y="653" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#77766f">0をまたぐ（未確立）</text>
<text x="48" y="760" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="12" font-weight="700" fill="#0b0b0b">凡例</text>
<ellipse cx="110" cy="755" rx="21" ry="11" fill="#eef4fd" stroke="#2a78d6" stroke-width="2"/>
<text x="140" y="760" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="12" font-weight="400" fill="#52514e">潜在変数</text>
