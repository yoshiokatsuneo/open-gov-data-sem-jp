<text x="570" y="760" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="12" font-weight="400" fill="#52514e">相関（因果を仮定しない）</text>
<text x="760" y="760" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="12" font-weight="400" fill="#77766f">数値は標準化係数　*** p&lt;.001　** p&lt;.01　* p&lt;.05</text>
<text x="48" y="780" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="11" font-weight="400" fill="#77766f">※ 横断データであり矢印の向きはデータからは決まらない。N = 47 に対して推定パラメータが多く、RMSEA は小標本で過大に出る。判断はブートストラップ区間を優先。</text>
<text x="48" y="798" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="11" font-weight="400" fill="#77766f">※「就業異動率」は転職率＋新規就業率との相関が 0.97 で定義上重複するため除外。「人口集中地区人口比率」は離職率と残差相関 0.29 を残すため都市度の指標から外した。</text>
<text x="48" y="816" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="11" font-weight="400" fill="#77766f">※ 1県抜き（47通り）での振れ: 都市→転職 +0.42〜+0.61（安定）、雇用の不安定さ→転職 +0.16〜+0.44（沖縄を抜くと +0.16 まで落ちる）。</text>
<text x="1232" y="798" text-anchor="end" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="11" fill="#77766f">出典: 総務省統計局 e-Stat 社会・人口統計体系</text>
