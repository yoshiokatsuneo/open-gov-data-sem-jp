<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="502" viewBox="0 0 1280 502" role="img">
<title>具体例：予測とのずれ</title>
<rect width="1280" height="502" fill="#fcfcfb"/>
<text x="40" y="38" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="23" font-weight="700" fill="#0b0b0b">具体例：予測とのずれ</text>
<text x="40" y="65" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="13" font-weight="400" fill="#77766f">残差＝実測値−予測値。標本内の当てはめであり、因果・異常の判定ではありません。</text>
<text x="40" y="89" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="13" font-weight="400" fill="#77766f">青丸：男 ／ 橙四角：女。単位：年 ｜ 補助回帰（SEM自体の予測ではない）</text>
<text x="490" y="112" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="12" font-weight="400" fill="#77766f">← 予測より低い</text>
<text x="830" y="112" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="12" font-weight="400" fill="#77766f">予測より高い →</text>
