<text x="40" y="438" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="12" font-weight="400" fill="#77766f">指定例と残差の極値・最小絶対値の例。残差が大きい順。</text>
