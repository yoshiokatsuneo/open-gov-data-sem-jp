<text x="78" y="706" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#52514e">所得と平均寿命(女)の相関が 0.06 しかなく、豊かさと健康は</text>
<text x="78" y="723" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#52514e">はっきり別の次元として分離する。</text>
