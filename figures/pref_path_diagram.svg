<text x="48" y="882" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="11" font-weight="400" fill="#77766f">※ 1県抜き（47通り）での振れ: 豊かさ→平均寿命(男) +0.42〜+0.67、豊かさ→医療キャパ -0.64〜-0.56。確立した2本はどちらも符号が反転しない。</text>
