<text x="78" y="672" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#52514e">国の比較では「人的資本」と「経済的繁栄」が標準化係数 0.97 で</text>
