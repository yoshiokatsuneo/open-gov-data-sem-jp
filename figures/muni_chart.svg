<text x="64" y="134" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="14.5" font-weight="700" fill="#0b0b0b">相関は「現象」ではなく「集計単位」の性質</text>
<text x="64" y="156" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="12" font-weight="400" fill="#77766f">両レベルに存在する7指標・21ペア。対角線から離れるほど集計レベルに依存する。</text>
