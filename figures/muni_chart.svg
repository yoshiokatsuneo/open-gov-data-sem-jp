<text x="48" y="50" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="21" font-weight="700" fill="#0b0b0b">市区町村データ（N≈1,660）に下りて分かったこと</text>
<text x="48" y="75" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="12.5" font-weight="400" fill="#77766f">転職率は市区町村まで下りていないため総移動率で代用。結果として、同じ問いには答えられないかわりに、相関が集計レベルに依存することと、N が検出力に効くことが見えた。</text>
