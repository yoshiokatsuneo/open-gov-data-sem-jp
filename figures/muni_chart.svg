<text x="672" y="601" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="11" font-weight="400" fill="#77766f">80指標中 21 件が閾値超え。都道府県版は沖縄を除くと 0 件だった。</text>
<rect x="40" y="632" width="1200" height="96" rx="8" fill="#fdf8ef" stroke="#e8d9b8"/>
<text x="64" y="656" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#8a6d1f">ただし、同じ問いには答えられていない</text>
<text x="64" y="678" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#52514e">・転職率は就業構造基本調査由来で、市区町村には無い。代用した総移動率は住民基本台帳の転入＋転出で、最も強い相関相手は単独世帯割合（r = 0.62）。労働市場ではなく世帯構成の現象。</text>
<text x="64" y="695" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#52514e">・完全失業率との相関は −0.14 で、都道府県で見えた「雇用の不安定さ → 転職」の経路は符号ごと再現しない。</text>
<text x="64" y="712" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#52514e">・都道府県で成立した「都市労働市場の厚み」の因子も市区町村では成立せず（RMSEA 0.22〜0.27）、潜在変数を立てずに重回帰した（R² = 0.594）。</text>
<text x="48" y="772" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="11" font-weight="400" fill="#77766f">※ 人口1,000人未満の35自治体は率が不安定なため除外。政令市・特別区部の合計行も区と二重計上になるため除外し、区単位で集計。</text>
