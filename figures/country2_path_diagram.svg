<text x="48" y="50" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="21" font-weight="700" fill="#0b0b0b">所得の割に人的資本が厚い国は、その後10年よく伸びる — 128か国の構造方程式モデリング（SEM）</text>
<text x="48" y="76" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="12.5" font-weight="400" fill="#77766f">World Bank Open Data（WGI 2012 ／ WDI 2010-14, 2020-23）。人的資本の各指標は初期所得に回帰した残差に置き換え、所得と直交させた。</text>
