<text x="48" y="50" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="21" font-weight="700" fill="#0b0b0b">人口密度は、正反対の経路を同時に走らせて移動を生む — 1,859市区町村のパス解析</text>
