<text x="64" y="144" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="15.5" font-weight="700" fill="#0b0b0b">密度が上がると単身が増えて移動が増えるが、同時に通勤流出が増えて単身が減る</text>
