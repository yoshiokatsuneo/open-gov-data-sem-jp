<text x="682" y="604" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#52514e">・全47県では2指標が閾値を超えた（工業地地価変動率 0.594、15歳未満人口割合 0.536）。</text>
<text x="682" y="621" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#52514e">・沖縄を除くと閾値 0.523 に対し最大 0.498 で、375指標のうち 0 件。</text>
<text x="682" y="638" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#52514e">・上位の顔ぶれも入れ替わる。1点で動く相関は知見ではない。</text>
<text x="48" y="694" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="11" font-weight="400" fill="#77766f">※ 沖縄県は残差 +1.54pt（3.4σ、2位の千葉 +0.85pt を大きく離す）であると同時に、人口増減率・自然増減率・住宅地地価変動率すべてで全国1位。説明側と結果側の両方で極端なため、1点だけで相関が立つ。</text>
<text x="48" y="712" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="11" font-weight="400" fill="#77766f">※ 沖縄は誤りではなく実在する県なので、除くのが正しいわけではない。言えるのは「この関係の根拠は観測1つ分しかない」ということ。</text>
